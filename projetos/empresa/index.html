<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech Soluções Inteligentes</title>
    <style>
        body { font-family: sans-serif; margin:0; background: #030712; color: #f9fafb; }
        .hero { padding: 100px 20px; text-align: center; background: radial-gradient(circle at center, #1e3a8a 0%, #030712 70%); }
        h1 { font-size: 3rem; color: #60a5fa; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #111827; padding: 30px; border: 1px solid #1f2937; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Infraestrutura & SaaS para Escala Global</h1>
        <p>Soluções em nuvem e desenvolvimento de software sob medida para médias e grandes empresas.</p>
    </div>
    <div class="container">
        <div class="grid">
            <div class="card"><h3>Cloud Infrastructure</h3><p>Arquiteturas em nuvem resilientes e escaláveis.</p></div>
            <div class="card"><h3>Desenvolvimento SaaS</h3><p>Plataformas web sob medida com alta segurança.</p></div>
        </div>
    </div>
</body>
</html>
