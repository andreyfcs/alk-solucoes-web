<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vitta | Saúde e Bem-Estar</title>
    <style>
        body { font-family: system-ui, sans-serif; margin:0; background: #ecfeff; color: #164e63; }
        .hero { background: #0891b2; color: #fff; padding: 80px 20px; text-align: center; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Clínica Vitta</h1>
        <p>Cuidado médico humanizado e infraestrutura completa para você e sua família.</p>
    </div>
    <div class="container">
        <h2 style="text-align:center;">Especialidades Atendidas</h2>
        <div class="grid">
            <div class="card"><h3>Cardiologia</h3><p>Exames e consultas de rotina.</p></div>
            <div class="card"><h3>Dermatologia</h3><p>Tratamentos clínicos e estéticos.</p></div>
            <div class="card"><h3>Pediatria</h3><p>Acompanhamento infantil contínuo.</p></div>
        </div>
    </div>
</body>
</html>
